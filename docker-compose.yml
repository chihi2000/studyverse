# Local development database. Run the app itself with `npm run dev`.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: studyverse
      POSTGRES_PASSWORD: studyverse
      POSTGRES_DB: studyverse
    ports:
      - "5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
